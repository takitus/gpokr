<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
    body {
        width: 280px;
        margin: 0;
        padding: 12px;
        font: 13px/1.5 -apple-system, "Segoe UI", Arial, sans-serif;
        color: #222;
    }
    h1 { font-size: 14px; margin: 0 0 8px; }
    label { display: block; cursor: pointer; user-select: none; margin: 4px 0; }
    label input { vertical-align: middle; margin-right: 6px; }
    hr { border: none; border-top: 1px solid #ddd; margin: 10px 0; }
    .row { display: flex; gap: 6px; }
    .row button {
        flex: 1;
        font-size: 12px;
        padding: 4px 0;
        border: 1px solid #c9c9c9;
        background: #fff;
        border-radius: 6px;
        cursor: pointer;
    }
    .row button:hover { background: #f0f0f0; }
    #status { font-size: 11px; color: #2a7a2a; min-height: 14px; margin-top: 4px; }
    #status.err { color: #b33; }
    .sec-title { font-weight: 600; margin: 2px 0 4px; }
    .bet-row { display: flex; gap: 5px; align-items: center; margin: 3px 0; }
    .bet-row .drag {
        cursor: grab;
        color: #aaa;
        user-select: none;
        font-size: 12px;
    }
    .bet-row.dragging { opacity: 0.45; }
    .bet-row.dragover { box-shadow: 0 -2px 0 0 #4c9aff; } /* insertion line above */
    .bet-row input[type=number] {
        width: 52px;
        box-sizing: border-box;
        padding: 2px 4px;
        border: 1px solid #c9c9c9;
        border-radius: 4px;
    }
    .bet-row select {
        flex: 1;
        padding: 2px;
        border: 1px solid #c9c9c9;
        border-radius: 4px;
        background: #fff;
    }
    .bet-row .del {
        border: none;
        background: none;
        color: #b33;
        cursor: pointer;
        font-size: 13px;
        padding: 0 3px;
    }
    .hint { font-size: 11px; color: #888; margin: 4px 0 0; }
    label select {
        font: 12px/1 inherit;
        padding: 2px 4px;
        border: 1px solid #c9c9c9;
        border-radius: 4px;
        background: #fff;
        color: #222;
        margin: 0 4px;
    }
    body.dark label select { background: #262e3b; color: #d2d8e2; border-color: #44516a; }
    /* popup's own dark theme, driven by the same setting */
    body.dark { background: #1f2530; color: #d2d8e2; }
    body.dark hr { border-top-color: #39455a; }
    body.dark .hint, body.dark #sessionNet { color: #93a0b4; }
    body.dark .row button, body.dark .bet-row .del {
        background: #2a3342;
        color: #d2d8e2;
        border-color: #45526b;
    }
    body.dark .row button:hover { background: #344056; }
    body.dark .bet-row input[type=number], body.dark .bet-row select {
        background: #262e3b;
        color: #d2d8e2;
        border-color: #44516a;
    }
    body.dark #sessionChart { background: #1a202a; }
    body.dark .bet-row .del { background: none; border: none; color: #e07b6e; }
    #sessionNet { font-weight: normal; color: #666; }
    #sessionNet.pos { color: #2a7a2a; }
    #sessionNet.neg { color: #b33; }
    #sessionChart {
        display: block;
        width: 100%;
        height: 48px;
        background: #f7f7f7;
        border-radius: 4px;
        margin: 4px 0 6px;
    }
</style>
</head>
<body>
<h1>GPokr Tools</h1>

<label><input type="checkbox" id="showOdds"> Odds HUD</label>
<label><input type="checkbox" id="showStats"> Player stats on avatars</label>
<label><input type="checkbox" id="darkMode"> Dark mode</label>
<label><input type="checkbox" id="fourColor"> Four-color deck <span class="hint">(blue diamonds, green clubs)</span></label>
<label>Card back
    <select id="cardBack">
        <option value="">classic (site)</option>
        <option value="rosette">rosette (red)</option>
        <option value="lattice">lattice (blue)</option>
        <option value="fan">fan (green)</option>
        <option value="deco">deco (gold)</option>
    </select>
    <span class="hint">(local to you)</span>
</label>
<label><input type="checkbox" id="shareHand"> Always share hand at showdown</label>
<label><input type="checkbox" id="localTest"> Local test mode</label>
<label><input type="checkbox" id="hotkeys"> Keyboard shortcuts <span class="hint">(F fold · C check/call · 1–9 bet sizes · ↑↓ ±1 blind)</span></label>

<hr>

<div class="sec-title">Bet buttons</div>
<label><input type="checkbox" id="showBetButtons"> Show bet buttons on the table</label>
<div id="betRows"></div>
<div class="row"><button id="addBetBtn">+ Add button</button></div>
<div class="hint">multiplier × blind or pot — decimals OK (.5 = half).
Set a row's base to "all in" for the all-in button.
Top/bottom picks the column above or below the bet field; drag ⠿ to reorder.</div>

<hr>

<div class="sec-title">Session <span id="sessionNet"></span></div>
<canvas id="sessionChart" width="256" height="48"></canvas>
<div class="row"><button id="sessionReset">Reset session</button></div>

<div id="status"></div>

<script src="popup.js"></script>
</body>
</html>
