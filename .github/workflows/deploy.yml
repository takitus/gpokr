# GitHub Actions workflow for the takitus/gpokr repo

name: Deploy to tools.gpokr.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token for AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest.json
        id: manifest
        run: echo "version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already live
        id: live
        run: |
          LIVE="$(curl -fsS https://tools.gpokr.com/current.json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' || true)"
          echo "Live: ${LIVE:-none} | Repo: ${{ steps.manifest.outputs.version }}"
          if [ "$LIVE" = "${{ steps.manifest.outputs.version }}" ]; then
            echo "::notice::v$LIVE is already live on tools.gpokr.com — bump the version in manifest.json to deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sanity checks
        if: steps.live.outputs.skip != 'true'
        run: |
          for f in odds.js content.js 3d/chips3d.js 3d/table3d.js 3d/coin3d.js 3d/beer3d.js bridge/ws-monitor.js vendor/three.iife.js overlay.css dark.css assets/table.png assets/gpokr-logo.svg; do
            test -s "$f" || { echo "::error::$f missing or empty"; exit 1; }
          done
          node --check odds.js
          node --check content.js
          node --check 3d/chips3d.js
          node --check 3d/table3d.js
          node --check 3d/coin3d.js
          node --check 3d/beer3d.js
          node --check bridge/ws-monitor.js
          # content.js resolves the renderers against its own URL, so the 3d/
          # prefix there and the S3 layout below must agree — a mismatch 404s in
          # the site-hosted build while the extension keeps working.
          grep -qF 'loadScript(base + "3d/chips3d.js")' content.js \
            || { echo "::error::content.js no longer loads 3d/chips3d.js — check the renderer paths"; exit 1; }
          grep -qF 'chrome-extension://__MSG_@@extension_id__/assets/table.png' dark.css \
            || { echo "::error::expected chrome-extension URL not found in dark.css"; exit 1; }

      # The extension-packaged dark-felt URL can't resolve in a web page;
      # make it relative so it resolves against /<version>/dark.css.
      - name: Rewrite extension asset URL for web
        if: steps.live.outputs.skip != 'true'
        run: sed -i 's|chrome-extension://__MSG_@@extension_id__/assets/table.png|assets/table.png|' dark.css

      # Minify to build/ (same pinned esbuild as pack.sh). --outbase=. keeps
      # vendor/ nested. three.iife.js alone drops ~1MB. Runs after the URL
      # rewrite so build/dark.css carries the web-relative asset path.
      - name: Minify JS/CSS with esbuild
        if: steps.live.outputs.skip != 'true'
        run: |
          npx --yes esbuild@0.28.1 \
            odds.js content.js 3d/chips3d.js 3d/table3d.js 3d/coin3d.js 3d/beer3d.js bridge/ws-monitor.js vendor/three.iife.js overlay.css dark.css \
            --minify --outdir=build --outbase=.

      - name: Authenticate to AWS (OIDC, no keys)
        if: steps.live.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::069812419770:role/gpokr-tools-github-deploy
          aws-region: us-east-1

      - name: Publish to S3
        if: steps.live.outputs.skip != 'true'
        run: |
          V="${{ steps.manifest.outputs.version }}"
          CACHE="public, max-age=31536000, immutable"
          # JS/CSS come from build/ (minified above); assets are copied as-is.
          aws s3 cp build/odds.js              "s3://tools.gpokr.com/$V/odds.js"              --content-type "application/javascript; charset=utf-8" --cache-control "$CACHE"
          aws s3 cp build/content.js           "s3://tools.gpokr.com/$V/content.js"           --content-type "application/javascript; charset=utf-8" --cache-control "$CACHE"
          # 3D renderers: fetched on demand by content.js from this same /<version>/
          # base (chip portal, coin toss, 3D table), so they must live here too —
          # under 3d/, matching the paths content.js builds and the repo layout.
          aws s3 cp build/3d/chips3d.js        "s3://tools.gpokr.com/$V/3d/chips3d.js"        --content-type "application/javascript; charset=utf-8" --cache-control "$CACHE"
          aws s3 cp build/3d/table3d.js        "s3://tools.gpokr.com/$V/3d/table3d.js"        --content-type "application/javascript; charset=utf-8" --cache-control "$CACHE"
          aws s3 cp build/3d/coin3d.js         "s3://tools.gpokr.com/$V/3d/coin3d.js"         --content-type "application/javascript; charset=utf-8" --cache-control "$CACHE"
          aws s3 cp build/3d/beer3d.js         "s3://tools.gpokr.com/$V/3d/beer3d.js"         --content-type "application/javascript; charset=utf-8" --cache-control "$CACHE"
          # The WebSocket tap: content.js fetches it from this same base. In the
          # site build it can only hook sockets opened after it lands (as an
          # extension it is a document_start MAIN-world content script instead).
          aws s3 cp build/bridge/ws-monitor.js "s3://tools.gpokr.com/$V/bridge/ws-monitor.js" --content-type "application/javascript; charset=utf-8" --cache-control "$CACHE"
          aws s3 cp build/vendor/three.iife.js "s3://tools.gpokr.com/$V/vendor/three.iife.js" --content-type "application/javascript; charset=utf-8" --cache-control "$CACHE"
          aws s3 cp build/overlay.css          "s3://tools.gpokr.com/$V/overlay.css"          --content-type "text/css; charset=utf-8"               --cache-control "$CACHE"
          aws s3 cp build/dark.css             "s3://tools.gpokr.com/$V/dark.css"             --content-type "text/css; charset=utf-8"               --cache-control "$CACHE"
          # Whole assets/ directory, so a new 3D model or image needs no edit
          # here — matching pack.sh, where everything under assets/ ships and
          # nothing outside it does. Images get their type guessed correctly
          # (image/png, image/svg+xml); models get theirs set explicitly in a
          # second pass, because the CLI's guess for .glb depends on the runner's
          # mimetypes table and silently falls back to binary/octet-stream where
          # model/gltf-binary is absent. GLTFLoader reads an ArrayBuffer and
          # wouldn't care, but a stable type keeps CloudFront's behaviour and any
          # future compression rule predictable.
          aws s3 sync assets/ "s3://tools.gpokr.com/$V/assets/" --cache-control "$CACHE" \
            --exclude '*.DS_Store' --exclude '*.glb'
          aws s3 sync assets/ "s3://tools.gpokr.com/$V/assets/" --cache-control "$CACHE" \
            --exclude '*' --include '*.glb' --content-type "model/gltf-binary"
          printf '{"version": "%s", "files": ["odds.js", "content.js", "overlay.css", "dark.css", "assets/table.png"], "syncedAt": "%s"}' \
            "$V" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > current.json
          aws s3 cp current.json s3://tools.gpokr.com/current.json --content-type "application/json" --cache-control "public, max-age=300"
          echo "::notice::Published v$V to https://tools.gpokr.com/"
