<!-- Dev harness for the river: loads three, coin3d/table3d/props3d straight off
     disk and holds one river on a stand-in table, so it can be measured (see
     __measure below) without a gpokr session. It has to sit at the repo root for
     those relative script paths to resolve, which is also why it cannot be named
     _riverbench.html: Chrome refuses to load an unpacked extension containing a
     root file whose name starts with "_" — that prefix is reserved (_locales,
     _metadata). Nothing packages it; pack.sh copies an explicit file list. -->

     props layer, so what draws over a seat here draws over it there too. */
  .av{position:absolute;width:100px;height:100px;z-index:8;box-sizing:border-box;
      border:1px solid #8e99ad;border-radius:6px;object-fit:contain;background-color:#20242c;}
</style>

<script>
  // Pretend to be the zoom under test: coin3d reads devicePixelRatio once per
  // viewport sync, which is the only thing browser zoom changes for the render.
  (function () {
    var q = new URLSearchParams(location.search);
    var dpr = parseFloat(q.get("dpr"));
    if (dpr > 0) Object.defineProperty(window, "devicePixelRatio", { get: function () { return dpr; } });
  })();
  // Hand-cranked clock, for anything shorter than a screenshot round-trip.
  // ?manual=1 parks the render loop and __step(ms) walks it forward — coin3d
  // takes its dt straight off the rAF timestamp (see frame()), so feeding it a
  // clock we control makes a 0.5s flight inspectable frame by frame instead of
  // being over before the screenshot lands. dt there is clamped to 50ms, so the
  // slice has to stay under that or time is silently lost.
  (function () {
    if (new URLSearchParams(location.search).get("manual") !== "1") return;
    var pending = [], clock = 0;
    window.requestAnimationFrame = function (cb) { pending.push(cb); return pending.length; };
    window.cancelAnimationFrame = function () {};
    window.__step = function (ms, sliceMs) {
      var slice = Math.min(sliceMs || 16, 40);
      var n = Math.max(1, Math.round(ms / slice));
      for (var i = 0; i < n; i++) {
        clock += slice;
        var due = pending; pending = [];
        for (var j = 0; j < due.length; j++) { try { due[j](clock); } catch (e) {} }
      }
      return clock;
    };
  })();
</script>

<script>
  window.__measure = function () {
    const cv = document.getElementById("gpe-coin-layer");
    if (!cv) return "nocanvas";
    const o = document.createElement("canvas");
    o.width = cv.width; o.height = cv.height;
    const g = o.getContext("2d", { willReadFrequently: true });
    g.drawImage(cv, 0, 0);
    const d = g.getImageData(0, 0, o.width, o.height).data;
    const acc = {};
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], gg = d[i + 1], b = d[i + 2], a = d[i + 3];
      if (a < 8) continue;
      const mx = Math.max(r, gg, b), mn = Math.min(r, gg, b);
      let k = null;
      if (b > 150 && b > r * 1.35 && b > gg * 1.1 && gg > r) k = "dash";
      else if (gg > 35 && gg > r * 1.25 && gg > b * 1.25) k = "grass";
      else if (b > 45 && b > r * 1.2 && b > gg * 1.05) k = "water";
      else if (mx > 70 && mx - mn < 34) k = "stone";
      if (!k) continue;
      const e = acc[k] || (acc[k] = [0, 0, 0]);
      const L = 0.2126 * r + 0.7152 * gg + 0.0722 * b;
      e[0]++; e[1] += L; e[2] += L * L;
    }
    const out = { size: o.width + "x" + o.height, dpr: devicePixelRatio, css: innerWidth + "x" + innerHeight, held: !!window.__held };
    for (const k of ["grass", "stone", "water", "dash"]) {
      const e = acc[k];
      if (!e) { out[k] = "none"; continue; }
      const n = e[0], m = e[1] / n;
      out[k] = n + " L" + m.toFixed(1) + " sd" + Math.sqrt(Math.max(0, e[2] / n - m * m)).toFixed(1);
    }
    return out;
  };
  window.addEventListener("load", function () {
    var q = new URLSearchParams(location.search);
    if (q.get("table3d") !== "0") { try { window.__t3d = window.GPE_TABLE3D.enable(); } catch (e) { window.__t3d = "err " + e.message; } }
    var r = document.getElementById("table").getBoundingClientRect();
    window.__rect = { left: r.left, top: r.top, right: r.right, bottom: r.bottom, width: r.width, height: r.height };
    var build = function () {
      var rr = document.getElementById("table").getBoundingClientRect();
      window.__rect = { left: rr.left, top: rr.top, right: rr.right, bottom: rr.bottom, width: rr.width, height: rr.height };
      window.__held = window.GPE_PROPS.holdRiver(0.6, window.__rect);
    };
    window.__build = build;
    // ?item=<catalog key> lobs one prop at the "to" avatar instead of holding a
    // river: the ordinary toss() path, so what shows up here is what a player
    // gets. Everything else on the page stays as it was.
    var item = q.get("item");
    if (item) {
      var rectOf = function (el) {
        var b = el.getBoundingClientRect();
        return { left: b.left, top: b.top, right: b.right, bottom: b.bottom,
          width: b.width, height: b.height };
      };
      window.__throw = function () {
        window.__tossed = window.GPE_PROPS.toss(item,
          rectOf(document.getElementById("from")),
          rectOf(document.getElementById("to")),
          rectOf(document.getElementById("table")),
          // Same opt content.js passes: props that occlude against the player
          // (the life ring) clone this element over the canvas.
          { avatar: document.getElementById("to") });
        return window.__tossed;
      };
      window.GPE_PROPS.ready(item).then(function (ok) {
        window.__ready = ok;
        if (ok) window.__throw();
      });
      return;
    }
    window.GPE_PROPS.ready("river").then(build);
    // A zoom change resizes the window, so this rebuilds the river at the new
    // devicePixelRatio and reprints the diag — one pair of lines per zoom step.
    var t = 0;
    window.addEventListener("resize", function () {
      clearTimeout(t);
      t = setTimeout(build, 350);
    });
  });
</script>
