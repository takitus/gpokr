<!doctype html>
<meta charset="utf-8">
<title>seat bench</title>
<!-- Drives REAL interaction events at a fake seat, so the celebrations can be
     tested without a table, a login, or somebody's seat.

     content.js only ever learns about another player's celebration one way: the
     page-world socket tap posts it to the window (see bridge/ws-monitor.js, and
     the "gpe-ws" branch of the message listener in content.js). That is a seam a
     test can use — post the same message and the whole real path runs, gate and
     payload validation included.

     What has to be faked is small: a stub for chrome.storage (settings default
     to on, so {} is enough), one seat panel with a profile link — nameForUserId
     resolves ids by scanning those — and a table element for the stunts to aim
     at. Loading content.js as a plain script makes SELF_SRC truthy, which is the
     site-hosted build's path, so the 3D files load by URL from this same server.

     It has to sit at the repo root for those paths to resolve, and it must NOT
     be named with a leading underscore: Chrome refuses to load an unpacked
     extension containing one (see riverbench.html).

       ?player=tester   the seat's name
     Then, from the console:
       __fire("dance"), __fire("rail"), __fire("clap")
       __state()        what the avatar and its cover count look like right now
       __overlap()      the back-to-back case: two stunts alive at once, then
                        report whether the avatar came back

     For the dealing animation there is also a board, in a container matching the
     one content.js looks for. Its cards are served from a path containing
     /GPokr/cards/<card>.png, which is the site's canonical path and the other
     thing stampCardImg recognises besides the deck's own hashes — the real art
     is inlined in GWT's bundle and is not ours to have, so a placeholder at that
     path is what gets a card stamped here.

       __flop(), __turn(), __river()   deal, the way GWT does: swap the src
       __board()                       per-slot card, cover count, visibility
-->

<script>
  // ---- hand-cranked clock (?manual=1) ------------------------------------
  // coin3d takes its dt from the rAF timestamp, so parking rAF and feeding it a
  // clock we control makes the ~0.7s deal inspectable frame by frame instead of
  // being over before a screenshot lands. content.js's own timers keep running;
  // only the renderer's loop is held. dt there is clamped to 50ms, so the slice
  // has to stay under that or time goes missing.
  (function () {
    if (new URLSearchParams(location.search).get("manual") !== "1") return;
    var pending = [], clock = 0;
    window.requestAnimationFrame = function (cb) { pending.push(cb); return pending.length; };
    window.cancelAnimationFrame = function () {};
    window.__step = function (ms, sliceMs) {
      var slice = Math.min(sliceMs || 16, 40);
      var n = Math.max(1, Math.round(ms / slice));
      for (var i = 0; i < n; i++) {
        clock += slice;
        var due = pending; pending = [];
        for (var j = 0; j < due.length; j++) { try { due[j](clock); } catch (e) {} }
      }
      return clock;
    };
  })();
</script>
<script>
  // ---- stubs, before content.js sees them --------------------------------
  // Settings are all opt-out or default-off, so an empty object is a valid
  // "everything at its default" — which has interactions and celebrations ON.
  (function () {
    const store = {};
    const listeners = [];
    window.chrome = {
      storage: {
        local: {
          // ASYNCHRONOUS, like the real one. Calling back synchronously runs
          // applySettings in the middle of content.js's own evaluation, which
          // trips temporal-dead-zone errors on every `let` declared below the
          // point it got to — the file is one IIFE and assumes, correctly, that
          // chrome.storage never answers before it has finished loading.
          get(keys, cb) { if (cb) setTimeout(() => cb(store), 0); },
          // Notifies listeners, like the real one: content.js re-reads its
          // settings from chrome.storage.onChanged, so a stub that stays silent
          // makes every option untestable.
          set(obj, cb) {
            const changes = {};
            for (const k in obj) { changes[k] = { oldValue: store[k], newValue: obj[k] }; }
            Object.assign(store, obj);
            setTimeout(() => { listeners.forEach((fn) => { try { fn(changes, "local"); } catch (e) {} }); }, 0);
            if (cb) setTimeout(cb, 0);
          },
          remove(k, cb) { if (cb) setTimeout(cb, 0); },
        },
        onChanged: { addListener(fn) { listeners.push(fn); } },
      },
      runtime: { getURL: (p) => "/" + p, id: "seatbench" },
    };
    const q = new URLSearchParams(location.search);
    const who = q.get("player");
    if (who) document.getElementById("who").textContent = who;
  })();
</script>
<script src="deck-svg.js"></script>
<script src="content.js"></script>
<script>
  // ---- the harness -------------------------------------------------------
  (function () {
    const ID = 4242;                       // matches the profile link above
    const avatar = () => document.querySelector("img.iogc-PlayerPanel-avatar");
    const log = (s) => { document.getElementById("log").textContent = s; };

    // The shape bridge/ws-monitor.js forwards. v/type must match content.js's
    // INTERACT_V and INTERACT_TYPE or the payload is rejected, which is the
    // point of sending it this way rather than calling something directly.
    window.__fire = function (item, seed) {
      const msg = {
        __gpe: "gpe-ws",
        ev: {
          typeName: "InteractionEvent",
          type: "gpe.throw",
          fromUserId: ID,
          toUserId: ID,
          payload: JSON.stringify({ v: 1, s: seed || 7, q: [[item]] }),
        },
      };
      window.postMessage(msg, location.origin);
      return item;
    };

    // Clones are body-level <img class="gpe-dance">; the count in the attribute
    // is how many stunts are holding the avatar hidden.
    window.__state = function () {
      const av = avatar();
      return {
        clones: document.querySelectorAll("img.gpe-dance").length,
        stuntAttr: av.getAttribute("data-gpe-stunt"),
        inlineVisibility: av.style.visibility || "(unset)",
        computedVisibility: getComputedStyle(av).visibility,
      };
    };

    // The reported bug: two celebrations still animating at the same time, and
    // the avatar never comes back. runningInteractions frees a sender's slot
    // when the interaction's promise chain resolves, which is long before the
    // animation it kicked off has finished — so the second one is accepted while
    // the first is still running, and both stunts hold the same avatar.
    window.__overlap = function (a, b, gapMs) {
      const marks = {};
      __fire(a || "dance");
      return new Promise((done) => {
        setTimeout(() => {
          marks.afterFirst = __state();
          __fire(b || "rail", 9);
          setTimeout(() => {
            marks.bothRunning = __state();
            // Long enough for both to finish: the longest stunt is ~4.3s.
            setTimeout(() => {
              marks.afterBoth = __state();
              marks.verdict = marks.afterBoth.computedVisibility === "visible"
                ? "PASS — avatar came back" : "FAIL — avatar still hidden";
              log(JSON.stringify(marks, null, 1));
              done(marks);
            }, 6000);
          }, 300);
        }, gapMs == null ? 900 : gapMs);
      });
    };

    // ---- the board ---------------------------------------------------------
    const slots = () => [...document.querySelectorAll("#board img.bcard")];
    const DECK = ["Ah", "Kd", "2c", "Ts", "7h", "Qs", "9d"];

    // Deal by swapping src, which is the only thing GWT does and the only signal
    // content.js gets. Relative, so it resolves under whatever root is serving.
    const deal = (n, from) => {
        const s = slots();
        for (let i = 0; i < n; i++) {
            const el = s[from + i];
            // Absolute, so getAttribute("src") already contains the canonical
            // path. Relative would only match once the image had loaded and
            // currentSrc filled in, which delays the stamp by a poll and is not
            // how the real thing behaves — GWT sets a data: URI, matched at once.
            if (el) el.src = "/GPokr/cards/" + DECK[from + i] + ".png";
        }
    };
    window.__flop = () => deal(3, 0);
    window.__turn = () => deal(1, 3);
    window.__river = () => deal(1, 4);
    window.__undeal = () => { slots().forEach((el) => el.removeAttribute("src")); };

    // The log, as GWT writes it. The board check reads these rows live.
    window.__log = (line) => {
        const d = document.createElement("div");
        d.className = "gwt-HTML";
        d.textContent = line;
        document.getElementById("log-panel").appendChild(d);
        return line;
    };
    window.__newHand = () => {
        document.getElementById("log-panel").textContent = "";
        window.__log("Starting Hand #" + Math.floor(performance.now()));
    };
    // Deal the way the site does: the log line, then the images.
    window.__logFlop = () => window.__log("Dealing flop: [" + DECK.slice(0, 3).join(", ") + "]");
    window.__logTurn = () => window.__log("Dealing turn: [" + DECK[3] + "]");
    window.__logRiver = () => window.__log("Dealing river: [" + DECK[4] + "]");
    // Your own two cards: the log line content.js reads them from, plus two
    // slots in the game window that belong to no seat, which is where gpokr puts
    // them (and why the DOM-only detector once mistook them for the board).
    window.__logHand = (a, b) => window.__log("Your pocket cards: [" + a + ", " + b + "]");
    window.__hand = (a, b) => {
        let wrap = document.getElementById("hand");
        if (!wrap) {
            wrap = document.createElement("div");
            wrap.id = "hand";
            wrap.style.cssText = "position:absolute;left:620px;top:430px;display:flex;gap:10px";
            document.querySelector(".iogc-GameWindow-container").appendChild(wrap);
            for (let i = 0; i < 2; i++) {
                const im = document.createElement("img");
                im.className = "hcard";
                im.style.cssText = "width:75px;height:103px;display:block";
                wrap.appendChild(im);
            }
        }
        const els = wrap.querySelectorAll("img.hcard");
        els[0].src = "/GPokr/cards/" + a + ".png";
        els[1].src = "/GPokr/cards/" + b + ".png";
        return [a, b];
    };
    // ---- seat badges --------------------------------------------------------
    // gpokr's away/turn ribbons: 58x21 Image widgets in the player panel, hidden
    // with display:none until they apply, and meant to sit on top of everything
    // at that seat. Placed over the hand cards here because that is the case that
    // broke — sit out mid-hand and your own hole cards bury the flag.
    //
    // The art is a stand-in, not gpokr's: what is under test is whether the badge
    // ends up on top, and a ribbon that is obviously not the site's makes it
    // impossible to mistake one for the other.
    const badgeArt = (text, bg) => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="58" height="29">' +
      '<g transform="rotate(-7 29 14.5)"><rect x="2" y="7" width="54" height="16" fill="' + bg + '"/>' +
      '<text x="29" y="19" font-family="Georgia,serif" font-size="12" fill="#fff" ' +
      'text-anchor="middle">' + text + '</text></g></svg>');

    function badgeEl(cls, text, bg) {
      let el = document.querySelector("." + cls);
      if (!el) {
        el = document.createElement("img");
        el.className = cls;
        el.src = badgeArt(text, bg);
        // Over the hand cards, and in the page's own stacking order — which is
        // exactly where it loses to our canvas.
        el.style.cssText = "position:absolute;left:640px;top:455px;width:58px;height:29px;display:none";
        document.querySelector(".iogc-GameWindow-container").appendChild(el);
      }
      return el;
    }
    // __away(true/false), __turn(true/false)
    window.__away = (on) => { badgeEl("iogc-PlayerPanel-away", "away", "#101010").style.display = on === false ? "none" : "block"; };
    window.__turn = (on) => { badgeEl("iogc-PlayerPanel-turn", "turn", "#0f5323").style.display = on === false ? "none" : "block"; };
    // Is the site's badge buried, and is ours standing in for it?
    window.__badges = () => [...document.querySelectorAll(".iogc-PlayerPanel-away, .iogc-PlayerPanel-turn")]
      .map((e) => ({ cls: e.className, shown: getComputedStyle(e).display !== "none" }));

    window.__handState = () => [...document.querySelectorAll("#hand img.hcard")].map((e) => ({
        card: e.dataset.gpeCard || null, covered: e.getAttribute("data-gpe-covered"),
        visibility: getComputedStyle(e).visibility }));

    // A card in the game window, in no seat panel, that the log never mentions —
    // the local player's own hole cards, which is what the DOM-only detector got
    // wrong. It must not be touched.
    window.__holeCard = (card) => {
        let el = document.getElementById("hole");
        if (!el) {
            el = document.createElement("img");
            el.id = "hole";
            el.style.cssText = "position:absolute;left:640px;top:420px;width:53px;height:69px";
            document.querySelector(".iogc-GameWindow-container").appendChild(el);
        }
        el.src = "/GPokr/cards/" + card + ".png";
        return el;
    };
    window.__holeState = () => {
        const el = document.getElementById("hole");
        return el ? { card: el.dataset.gpeCard || null, covered: el.getAttribute("data-gpe-covered"),
            visibility: getComputedStyle(el).visibility } : null;
    };

    // ---- chip stacks -------------------------------------------------------
    // A faithful reimplementation of gpokr's ChipStack.setAmount, from the
    // compiled permutation: spend the amount greedily from the largest chip
    // down, choose a column count from the total (<=2 -> 1, <=8 -> 2, <=12 -> 3,
    // else 4), fill ceil(total/columns) chips per column, and tag each sprite
    // cs-pos<column>-<row>. Then a "$N" label over the lot.
    //
    // The art is OURS, not the site's: coloured discs standing in for its 24x21
    // PNGs. What is being tested is the geometry and the covering, and a
    // placeholder that is obviously not gpokr's chip makes an UNcovered sprite
    // impossible to miss.
    const CS_DENOMS = [250000, 50000, 10000, 2500, 500, 100, 25, 5, 1];
    const CS_COLOR = {
      1: "#4f4f4f", 5: "#860000", 25: "#1d9841", 100: "#000000", 500: "#a8007f",
      2500: "#5397d9", 10000: "#c0f0a8", 50000: "#efe2b8", 250000: "#d0e2e1",
    };
    const CS_POS = [[13, 12], [38, 12], [0, 31], [25, 31]];
    const csSprite = (d) => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="21">' +
      '<ellipse cx="12" cy="10.5" rx="11.5" ry="10" fill="' + CS_COLOR[d] + '"/>' +
      '<ellipse cx="12" cy="10.5" rx="7" ry="6" fill="#fff"/></svg>');

    function csFill(box, amount) {
      box.textContent = "";
      if (!(amount > 0)) return;
      const chips = [];
      let left = amount;
      for (const d of CS_DENOMS) {
        const n = Math.floor(left / d);
        for (let i = 0; i < n; i++) chips.push(d);
        left %= d;
      }
      const c = chips.length;
      const n = c <= 2 ? 1 : c <= 8 ? 2 : c <= 12 ? 3 : 4;
      const per = Math.ceil(c / n);
      let col = 0, row = 0;
      for (const d of chips) {
        const img = document.createElement("img");
        img.src = csSprite(d);
        img.className = "cs-pos" + col + "-" + row;
        const p = CS_POS[Math.min(col, 3)];
        img.style.cssText = "position:absolute;width:24px;height:21px;left:" +
          p[0] + "px;top:" + (p[1] - row * 2) + "px";
        box.appendChild(img);
        if (++row >= per) { col++; row = 0; }
      }
      const lab = document.createElement("div");
      lab.className = "gpokr-ChipStack-label";
      lab.textContent = "$" + amount.toLocaleString();
      box.appendChild(lab);
    }

    const csBox = (id) => document.querySelector("#" + id + " .gpokr-ChipStack-chips");
    window.__bet = (amount) => { csFill(csBox("bet-a"), amount); return amount; };
    window.__pot = (amount) => { csFill(csBox("pot"), amount); return amount; };
    // What the extension has actually done to a stack: is each sprite covered,
    // and how many discs is it drawing in its place?
    window.__chips = (id) => Array.from(csBox(id || "bet-a").querySelectorAll("[class*=cs-pos]"))
      .map((el) => ({ cls: el.className, covered: el.hasAttribute("data-gpe-covered"),
                      vis: getComputedStyle(el).visibility }));

    window.__board = () => slots().map((el, i) => ({
        slot: i,
        card: el.dataset.gpeCard || null,
        covered: el.getAttribute("data-gpe-covered"),
        visibility: getComputedStyle(el).visibility,
    }));

    // Actors and textures the renderer is holding, for leak checks.
    window.__running = () => !!(window.GPE_COIN && GPE_COIN.isRunning());

    // The renderer on its own, bypassing content.js's detector and — the point —
    // its watchdog, which under a frozen clock reasonably concludes the animation
    // has stalled and hands the card back. Use this to park the deal on any frame
    // and look at it: __dealRaw(0); __step(180).
    window.__dealRaw = function (i, opts) {
        const el = slots()[i];
        el.src = "/GPokr/cards/" + DECK[i] + ".png";
        el.setAttribute("data-gpe-covered", "1");     // cover it by hand
        const b = el.getBoundingClientRect();
        return window.GPE_COIN.dealCard(
            { left: b.left, top: b.top, width: b.width, height: b.height },
            el, Object.assign({ backStyle: "" }, opts || {}));
    };

    window.__set = (patch) => new Promise((done) => {
        chrome.storage.local.get(["gpe_settings"], (r) => {
            const next = Object.assign({}, r.gpe_settings || {}, patch);
            chrome.storage.local.set({ gpe_settings: next }, () => setTimeout(done, 120));
        });
    });

    log("ready. __flop() | __bet(275) | __hand('Ah','Kd') | __away() | __badges()");
  })();
</script>
